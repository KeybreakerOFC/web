<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>JXLL | Enterprise Portal</title>
    
    <style>
        :root {
            --bg-start: #0f172a;
            --bg-end: #1e293b;
            --accent-primary: #38bdf8;
            --accent-secondary: #0284c7;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-status: #cbd5e1;
            --success-color: #10b981;
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.05);
            --cube-border: rgba(56, 189, 248, 0.3);
            --cube-bg: rgba(255, 255, 255, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* Black background fallback for AMOLED panels, gradient on top */
            background-color: #000000;
            background-image: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            height: 100vh;
            /* SafeArea support for notched devices (Samsung/iOS) */
            height: calc(100vh - env(safe-area-inset-bottom, 0px));
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            perspective: 1200px;
            color: var(--text-primary);
        }

        .loader-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-style: preserve-3d;
            width: 90%; /* Fluid width */
            max-width: 450px;
            padding: 40px 20px;
            background: var(--glass-bg);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .scene-3d {
            width: 90px;
            height: 90px;
            perspective: 1200px;
            margin-bottom: 40px;
            margin-top: 10px;
        }

        .cube-3d {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            /* Hardware acceleration hint for One UI / mobile browsers */
            will-change: transform; 
            transform: rotateX(-20deg) rotateY(25deg);
            transition: transform 0.15s ease-out;
        }

        .cube-3d.auto-rotate {
            animation: rotateCube 8s infinite linear;
        }

        .cube-face {
            position: absolute;
            width: 90px;
            height: 90px;
            background: var(--cube-bg);
            border: 1px solid var(--cube-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3), inset 0 0 15px rgba(56, 189, 248, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 400;
            color: var(--accent-primary);
            font-size: 1.5rem;
        }

        .face-front  { transform: translateZ(45px); }
        .face-back   { transform: rotateY(180deg) translateZ(45px); }
        .face-left   { transform: rotateY(-90deg) translateZ(45px); }
        .face-right  { transform: rotateY(90deg) translateZ(45px); }
        .face-top    { transform: rotateX(90deg) translateZ(45px); }
        .face-bottom { transform: rotateX(-90deg) translateZ(45px); }

        .brand-text {
            color: var(--text-primary);
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 5px;
            margin-left: 4px; /* Optical center alignment for letter-spacing */
        }

        .brand-subtext {
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 35px;
            text-align: center;
        }

        .progress-bar-container {
            width: 85%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
            transition: width 0.2s ease-out, background-color 0.3s ease;
        }

        .status-text {
            color: var(--text-status);
            font-size: 0.8rem;
            margin-top: 25px;
            font-weight: 400;
            text-align: center;
            height: 20px;
            transition: color 0.3s ease;
        }

        @media (min-width: 1024px) {
            .loader-container {
                padding: 50px 40px;
                max-width: 500px;
            }
            .brand-text {
                font-size: 2.5rem;
                letter-spacing: 8px;
                margin-left: 8px;
            }
            .brand-subtext {
                font-size: 0.85rem;
                letter-spacing: 4px;
            }
            .scene-3d {
                width: 110px;
                height: 110px;
                margin-bottom: 50px;
            }
            .cube-face {
                width: 110px;
                height: 110px;
                font-size: 1.8rem;
            }
            /* Adjust Z-translation for larger cube */
            .face-front  { transform: translateZ(55px); }
            .face-back   { transform: rotateY(180deg) translateZ(55px); }
            .face-left   { transform: rotateY(-90deg) translateZ(55px); }
            .face-right  { transform: rotateY(90deg) translateZ(55px); }
            .face-top    { transform: rotateX(90deg) translateZ(55px); }
            .face-bottom { transform: rotateX(-90deg) translateZ(55px); }
            
            .progress-bar-container {
                height: 6px;
                border-radius: 6px;
            }
            .status-text {
                font-size: 0.9rem;
            }
        }

        @media (max-width: 768px) and (orientation: portrait) {
            .loader-container {
                padding: 30px 15px;
                /* Slightly narrower on very tall screens to look more elegant */
                width: 85%; 
            }
            .scene-3d {
                width: 80px;
                height: 80px;
                margin-bottom: 30px;
            }
            .cube-face {
                width: 80px;
                height: 80px;
                font-size: 1.3rem;
            }
            .face-front  { transform: translateZ(40px); }
            .face-back   { transform: rotateY(180deg) translateZ(40px); }
            .face-left   { transform: rotateY(-90deg) translateZ(40px); }
            .face-right  { transform: rotateY(90deg) translateZ(40px); }
            .face-top    { transform: rotateX(90deg) translateZ(40px); }
            .face-bottom { transform: rotateX(-90deg) translateZ(40px); }
            
            .brand-text {
                font-size: 1.8rem;
            }
            .status-text {
                font-size: 0.75rem;
            }
        }

        @keyframes rotateCube {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="scene-3d">
            <div class="cube-3d auto-rotate" id="cube">
                <div class="cube-face face-front">J</div>
                <div class="cube-face face-back">X</div>
                <div class="cube-face face-left">L</div>
                <div class="cube-face face-right">L</div>
                <div class="cube-face face-top"></div>
                <div class="cube-face face-bottom"></div>
            </div>
        </div>

        <h1 class="brand-text">JXLL</h1>
        <div class="brand-subtext">Secure Enterprise Portal</div>

        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        
        <div class="status-text" id="statusText">Initializing secure environment...</div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const cube = document.getElementById("cube");
            const progressFill = document.getElementById("progressFill");
            const statusText = document.getElementById("statusText");
            
            // Interactive hover effect - Only for desktop devices with mice
            if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
                cube.classList.remove("auto-rotate");
                
                document.addEventListener("mousemove", (e) => {
                    const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
                    const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
                    
                    cube.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
                });
            }

            const triggerVibration = (ms) => {
                if (navigator.vibrate) {
                    try {
                        navigator.vibrate(ms);
                    } catch (e) {
                        console.warn("Haptic feedback restricted by browser.");
                    }
                }
            };

            let progress = 0;
            const logMessages = [
                "Verifying session integrity...",
                "Establishing encrypted connection...",
                "Authenticating credentials...",
                "Finalizing secure handshake..."
            ];

            const loadScheduler = setInterval(() => {
                progress += Math.floor(Math.random() * 8) + 2; 
                
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(loadScheduler);
                    
                    statusText.innerText = "Access Authorized.";
                    statusText.style.color = "var(--success-color)"; 
                    
                    progressFill.style.background = "var(--success-color)";
                    progressFill.style.boxShadow = "0 0 15px rgba(16, 185, 129, 0.4)";
                    
                    triggerVibration([30, 50, 30]); 

                    setTimeout(() => {
                        window.location.href = "inicio.html";
                    }, 850);
                }

                progressFill.style.width = `${progress}%`;

                if (progress > 10 && progress < 35) statusText.innerText = logMessages[0];
                if (progress > 35 && progress < 65) {
                    if(statusText.innerText !== logMessages[1]) triggerVibration(10);
                    statusText.innerText = logMessages[1];
                }
                if (progress > 65 && progress < 85) statusText.innerText = logMessages[2];
                if (progress > 85 && progress < 100) {
                    if(statusText.innerText !== logMessages[3]) triggerVibration(15);
                    statusText.innerText = logMessages[3];
                }

            }, 150); 
        });
    </script>
</body>
</html>
